  /api/v0/profile/{user_id}/:
    get:
      operationId: profile_retrieve
      description: Show the profile for a user with the given user_id.
      summary: Get user profile
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - profile
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePublic'
          description: ''
    patch:
      operationId: profile_partial_update
      description: All fields supplied will be updated. Fields that do not need to
        be changed do not need to be submitted
      summary: Update user profile
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
        required: true
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePrivate'
          description: ''
  /api/v0/profile/all/:
    get:
      operationId: profile_all_list
      description: "\n        \n    Search fields include :\"user__username\", \"\
        user__first_name\", \"user__last_name\", \"country\", \"about_me\".\n\n  \
        \  Ordering includes: \"country\", \"native_language\", \"user__username\"\
        , \"user__first_name\", \"user__last_name\", \"id\", \"date_joined\".\n\n\
        \    Example: /api/v0/profile/all?search=home&?search=united&limit=10&ordering=-country&offset=10\n\
        \    "
      summary: 'Returns list of all profiles. '
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfilePublicList'
          description: ''
  /api/v0/profile/current_user/:
    get:
      operationId: profile_current_user_retrieve
      summary: Returns profile details of user currently logged in.
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePrivate'
          description: ''
  /api/v0/token/blacklist/:
    post:
      operationId: token_blacklist_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
