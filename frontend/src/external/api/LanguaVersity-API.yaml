      type: object
      properties:
        uid:
          type: string
        token:
          type: string
        new_password:
          type: string
        re_new_password:
          type: string
      required:
      - new_password
      - re_new_password
      - token
      - uid
    PatchedUpdateProfile:
      type: object
      properties:
        profile_photo:
          type: string
          format: uri
        about_me:
          type: string
        country:
          $ref: '#/components/schemas/CountryEnum'
        native_language:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/NativeLanguageEnum'
          - $ref: '#/components/schemas/NullEnum'
    PatchedUser:
      type: object
      properties:
        id:
